# Increase Gradle JVM memory to avoid Kotlin/Gradle OOM during compilation
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Xss1m
org.gradle.workers.max=1
# Keep Kotlin compiler in-process by default; if daemon is preferred, change to 'daemon'
kotlin.compiler.execution.strategy=in-process
# Provide JVM args for Kotlin daemon if it is used on the system
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=128m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37.0
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
